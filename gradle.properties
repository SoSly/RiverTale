# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
# This is required to provide enough memory for the Minecraft decompilation process.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

####################
## Mod Information
####################
mod_version = 0.1.0-alpha
mod_authors = nivthefox
mod_group = org.sosly.rivertale
mod_id = rivertale
mod_name = RiverTale
mod_license = MIT
mod_credits = Thanks to my wife anomalagous for her unwavering support.
mod_description = Fix how rivers flow in Minecraft. Rivers will flow from high elevation towards the ocean, including realistic elevation changes, basins, and natural water flow patterns.
mod_logo = rivertale.png

####################
## Core Configuration
###################
run_xmx = 10G
run_xms = 2G

minecraft_version = 1.20.1
minecraft_version_range = [1.20.1,)
api_name = forge
api_version = 47.1.100
api_version_range = [47.1,48)
loader_version_range = [2,)
mappings_channel = parchment
mappings_version = 2023.09.03-1.20.1

####################
## Required Terrain Generator
###################
reterraforged_version = 0.0.6-sosly-1.0.0

####################
## Optional Dependencies
###################
jei_enabled = false
jei_projectId = 238222
jei_fileId = 5074448

journeymap_enabled = false
journeymap_projectId = 32274
journeymap_fileId = 5789363

spark_enabled = true
spark_projectId = 361579
spark_fileId = 4738952

# Official C2ME has no Forge 1.20.1 build. This is Makki132's port, loaded deobfuscated at runtime.
# A loose jar in run/client/mods does not remap its mixin shadows for this parchment client.
c2me_enabled = true
c2me_projectId = 1610389
c2me_fileId = 9387498

# Fast Noise 1.0.13 hardcodes an SRG accessor and ships no refmap. A loose jar still crashes this parchment dev client.
fastnoise_enabled = false
fastnoise_projectId = 1460602
fastnoise_fileId = 8398218

# Structure Layout Optimizer is Forge, not NeoForge, but every 1.20.1 file requires Forge 47.3.0 or 47.3.12.
# This project is 47.1.100, so it cannot load. Resourceful Config was only its dependency.
structure_layout_optimizer_enabled = false
structure_layout_optimizer_projectId = 1087831
structure_layout_optimizer_fileId = 9619239
resourcefulconfig_projectId = 714059
resourcefulconfig_fileId = 6231176

####################
## Deployment Configuration
###################
# Replace these with your actual project IDs when you register your mod
curseforge_project_id = YOUR_PROJECT_ID
modrinth_project_id = YOUR_PROJECT_ID
